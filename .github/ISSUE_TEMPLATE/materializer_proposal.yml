name: New materializer proposal
description: Propose materializing streams into a new table format or store.
title: "Materializer: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new materializer. Please read
        [Write a materializer](https://github.com/lakestream-io/ursa/blob/main/docs/developer/materializer-guide.md)
        first. New materializers live in their own repositories, and every new materializer needs a LIP.
        This issue tracks the proposal until the LIP is ready.
  - type: input
    id: destination
    attributes:
      label: Destination
      description: The table format or store, and the versions you plan to support.
      placeholder: "Apache Paimon 1.x"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who needs this, and what do they do with the materialized data?
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Where the code will live
      description: A link to the repository, if it exists yet.
  - type: textarea
    id: maintainers
    attributes:
      label: Maintainers
      description: Who will maintain the materializer and answer issues about it?
    validations:
      required: true
  - type: textarea
    id: commit
    attributes:
      label: Commit and replay
      description: >-
        A failed task is retried over the same offset range. How will the materializer avoid writing the same
        records twice? For example, a transactional commit marker, or deduplication by key.
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Schema mapping and evolution
      description: How will stream schemas (Avro, JSON Schema, Protobuf) map to the destination, and which changes can it follow?
    validations:
      required: true
  - type: textarea
    id: client
    attributes:
      label: Client libraries and licenses
      description: The libraries the materializer depends on, and their licenses.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: How will it be tested? For example, a Testcontainers image for the destination.
    validations:
      required: true
  - type: textarea
    id: registration
    attributes:
      label: Registration
      description: The proposed catalog type name, and the configuration prefix operators would use.
      placeholder: "PAIMON; paimon.catalog.<name>.*"
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I understand that every new materializer needs a LIP (docs/lip/README.md).
          required: true
