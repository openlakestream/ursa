name: Bug report
description: Something in Ursa doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't report security vulnerabilities here.
        Follow [SECURITY.md](https://github.com/lakestream-io/ursa/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and include any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest set of steps, configuration or code that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ursa version or commit
      placeholder: "1.0.0, or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Area
      description: Where do you think the problem is? Choose "Not sure" if you don't know.
      options:
        - Not sure
        - lakestream-api
        - ursa-storage-core (WAL, object storage)
        - ursa-storage-lakestream (catalog, logs, cursors, readers, writers)
        - ursa-storage-compact (compaction)
        - ursa-storage-materialization (materialization framework, schema handling)
        - ursa-storage-lakehouse (Iceberg, Delta)
        - ursa-storage-clickhouse
        - ursa-storage-kafka-runtime or ursa-storage-lakehouse-kafka-reader
        - Build, tests or tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Java version, operating system, object store, and anything else that might matter.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log output here. It is formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find this problem.
          required: true
        - label: This isn't a security vulnerability.
          required: true
